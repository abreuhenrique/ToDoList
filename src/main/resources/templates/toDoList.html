<!
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToDoList</title>
    <style>

        .btn-new-task {
            font-family: Arial, sans-serif;
            background-color: #374151;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;

        }

        .todo-table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .todo-table th, .todo-table td {
            padding: 12px 16px;
            text-align: left;
        }

        .todo-table th {
            background-color: #4f46e5;
            color: #ffffff;
            font-weight: bold;
        }

        .todo-table tr:nth-child(even) {
            background-color: #f9fafb;
        }

        .todo-table tr:hover {
            background-color: #f3f4f6;
        }

        .todo-table td {
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
            text-decoration: none;
        }

        .todo-completed {
            color: #9ca3af;
        }

        .todo-completed:hover {
            background-color: #7fff0a;
        }

        .btn-delete {
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background-color: #dc2626;
        }

    </style>
</head>
<body>
    <h1>ToDoList</h1>

    <a th:href="@{/todo/ui/criar}" class="btn-new-task">Adicionar Nova Task</a>

    <table class="todo-table">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Prazo</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="tasks: ${tasks}">
            <td th:text="${tasks.nome}"></td>
            <td th:text="${tasks.prazo}"></td>
            <td th:text="${tasks.status}"></td>
            <td>
                <a th:href="@{/todo/ui/listar/{id}(id=${tasks.id})}">Ver detalhes</a>
            </td>
            <td class="btn-delete">
                <a th:href="@{/todo/ui/excluir/{id}(id=${tasks.id})}">Excluir</a>
            </td>
            <td>
                <a th:href="@{/todo/ui/atualizar/{id}(id=${tasks.id})}">Atualizar</a>
            </td>
            <td class="todo-completed">
                <a th:href="@{/todo/ui/concluir/{id}(id=${tasks.id})}">Concluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
